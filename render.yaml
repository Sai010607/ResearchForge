# Render blueprint for the FastAPI backend. Database: a free Neon PostgreSQL (see README_DEPLOY.md).
services:
  - type: web
    name: researchforge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: FRONTEND_URL
        value: https://researchforgess.netlify.app
      - key: CORS_ORIGINS
        value: https://researchforgess.netlify.app
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # paste your Neon URL, see README_DEPLOY.md
      # --- optional services; enter values in the Render dashboard (never commit them) ---
      - key: BREVO_API_KEY
        sync: false   # HTTPS email API: SMTP ports are blocked on Render free instances
      - key: MAIL_FROM
        sync: false   # e.g. ResearchForge <you@example.com>; must be a sender verified in Brevo
      - key: SPRINGER_API_KEY
        sync: false   # Springer Nature Meta API key (dev.springernature.com)
      - key: SPRINGER_OA_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false   # lets OpenAlex / Crossref / NCBI put you in their faster "polite" pools
