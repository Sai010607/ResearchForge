# Render blueprint for the FastAPI backend. Database: a free Neon PostgreSQL (see README_DEPLOY.md).
services:
  - type: web
    name: researchforge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: FRONTEND_URL
        value: https://researchforgess.netlify.app
      - key: CORS_ORIGINS
        value: https://researchforgess.netlify.app
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # paste your Neon URL, see README_DEPLOY.md
