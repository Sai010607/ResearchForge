services:
  postgres:
    image: postgres:16
    container_name: researchforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: researchforge
      POSTGRES_PASSWORD: researchforge
      POSTGRES_DB: researchforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
