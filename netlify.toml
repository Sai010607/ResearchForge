# Netlify config (frontend). The backend runs on Render; /api/* is proxied to it so that
# login cookies and CSRF checks stay same-site. Edit the backend URL below if yours differs.
[build.environment]
  NEXT_PUBLIC_API_URL = "same-origin"

[[redirects]]
  from = "/api/*"
  to = "https://researchforge-api.onrender.com/api/:splat"
  status = 200
  force = true
